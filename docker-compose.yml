services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: tradeops-app
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html
    environment:
      APP_ENV: local
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - tradeops

  nginx:
    image: nginx:1.27-alpine
    container_name: tradeops-nginx
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8090}:80"
    volumes:
      - .:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks:
      - tradeops

  postgres:
    image: postgres:16-alpine
    container_name: tradeops-postgres
    restart: unless-stopped
    ports:
      - "${FORWARD_DB_PORT:-5433}:5432"
    environment:
      POSTGRES_DB: "${DB_DATABASE:-tradeops}"
      POSTGRES_USER: "${DB_USERNAME:-tradeops}"
      POSTGRES_PASSWORD: "${DB_PASSWORD:-secret}"
    volumes:
      - tradeops-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-tradeops} -d ${DB_DATABASE:-tradeops}"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - tradeops

  pgadmin:
    image: dpage/pgadmin4:8
    container_name: tradeops-pgadmin
    restart: unless-stopped
    ports:
      - "${FORWARD_PGADMIN_PORT:-8091}:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: "${PGADMIN_DEFAULT_EMAIL:-admin@example.com}"
      PGADMIN_DEFAULT_PASSWORD: "${PGADMIN_DEFAULT_PASSWORD:-secret}"
    volumes:
      - tradeops-pgadmin:/var/lib/pgadmin
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - tradeops

networks:
  tradeops:
    driver: bridge

volumes:
  tradeops-postgres:
  tradeops-pgadmin:
